name: Release (Docker)

# Release 发布后构建并发布多架构镜像到 GHCR（amd64 / arm64 / armv7）。
# 编译在 buildx 里用交叉编译完成（见 Dockerfile 头部说明），不需要 QEMU 跑 npm / go。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag（如 v0.1.0，仅手动触发时用）'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    name: 构建并发布镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'release' }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            VERSION=${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
            GIT_COMMIT=${{ github.sha }}
            BUILT_AT=${{ github.event.head_commit.timestamp }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
