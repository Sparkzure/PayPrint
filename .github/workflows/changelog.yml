name: Release Notes

# 推 v* tag：按 Conventional Commits 生成发布说明并创建 GitHub Release。
# Release 创建成功会接着触发 release.yml（四平台二进制）与 release_docker.yml（镜像），
# 所以发布动作只有一个入口：打 tag。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  changelog:
    name: 生成发布说明并创建 Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # changelogithub 需要完整历史来按 tag 分组提交。
          fetch-depth: 0

      - name: changelogithub
        # --draft：只生成草稿，由维护者在 Releases 页手动 Publish。
        # GITHUB_TOKEN 发布的 release 不触发 release: published 事件
        # （GitHub 防递归机制），草稿改成手动发布正是 OpenList 的做法。
        run: npx changelogithub --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
