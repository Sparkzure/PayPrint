name: Release

# Release 发布（人工 Publish）后，构建四平台单二进制并挂到该 Release 上。
# 版本号取 Release 的 tag 名，经 -ldflags 写进启动日志；前端产物从
# PayPrint-Frontend 最新 Release 下载（build.sh 自带，走认证的 GitHub API）。

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  assets:
    name: 构建 ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-amd64,   goos: linux,   goarch: amd64 }
          - { target: linux-arm64,   goos: linux,   goarch: arm64 }
          - { target: linux-armv7,   goos: linux,   goarch: arm,   goarm: '7' }
          - { target: windows-amd64, goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 构建（VERSION 取自 tag）
        env:
          # 传给 scripts/web.sh：认证后的 GitHub API 不吃匿名限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOAMD64: v1
        run: |
          # go build -o does not append .exe automatically; add it for windows targets
          EXE="payprint-server-${{ matrix.target }}"
          case "${{ matrix.target }}" in windows*) EXE="$EXE.exe" ;; esac
          sh scripts/build.sh --version "$TAG" -o "dist/$EXE"

      - name: 打包（zip 内是平台原生二进制）
        run: |
          mkdir -p upload
          EXE="payprint-server-${{ matrix.target }}"
          case "${{ matrix.target }}" in windows*) EXE="$EXE.exe" ;; esac
          cp "dist/$EXE" "upload/$EXE"
          ZIP="payprint-server-$TAG-${{ matrix.target }}.zip"
          ( cd upload && zip -q "$ZIP" "$EXE" )
          sha256sum "upload/$ZIP" > "upload/$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "upload/$ZIP" "upload/$ZIP.sha256" --clobber
