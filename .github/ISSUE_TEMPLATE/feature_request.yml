name: 功能建议
description: 提一个改进想法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先描述你遇到的场景与痛点，比直接给方案有用得多
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 包括"什么都不做会怎样"
    validations:
      required: false

  - type: textarea
    id: constraints
    attributes:
      label: 是否触及既有约束
      description: |
        本项目有一批硬约束（见 `docs/DEVELOPMENT.md` 的「关键设计约束」与「安全红线」），
        例如「到账不出纸、用户确认才出纸」「设备全局唯一」「单二进制交付」。
        如果你的建议会改动其中之一，请说明为什么值得改、代价是什么。
    validations:
      required: false
